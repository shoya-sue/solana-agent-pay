<text x="600.0" y="20" fill="#8b949e" text-anchor="middle" style="font-size:12px">$ npm run demo  —  real devnet run (excerpt of demo-output.txt, ⋮ = lines omitted, … = truncated)</text>
<text x="20" y="52" fill="#e6edf3" class="b" xml:space="preserve">solana-agent-pay — an AI agent that pays for API calls by itself (Solana devnet, x402-style)</text>
<text x="20" y="71" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="90" fill="#e6edf3" class="b" xml:space="preserve">━━━ 3. Scenario A — a task that needs paid data ━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
<text x="20" y="109" fill="#e6edf3" class="b" xml:space="preserve">👤 Task: 東京と大阪の今日の天気と空気の質を比べて、夕方に散歩するならどちらが向いているか教えてください。</text>
<text x="20" y="128" fill="#79c0ff" class="" xml:space="preserve">🤖 Total needed: 2×0.02 + 2×0.01 = 0.06.</text>
<text x="20" y="147" fill="#d2a8ff" class="" xml:space="preserve">🔧 request_api({"path":"/api/weather","query":{"city":"Tokyo"}})</text>
<text x="20" y="166" fill="#8b949e" class="" xml:space="preserve">   [server] 402 /api/weather?city=Tokyo (no payment)</text>
<text x="20" y="185" fill="#e3b341" class="" xml:space="preserve">   💳 402 Payment Required: /api/weather?city=Tokyo → 0.02 dUSDC (memo x402-4U3zxUVhcaDcpmmAfsxCoX)</text>
<text x="20" y="204" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="223" fill="#d2a8ff" class="" xml:space="preserve">🔧 pay_and_retry({"quote_id":"q1","justification":"Tokyo weather needed for the comparison."})</text>
<text x="20" y="242" fill="#56d364" class="" xml:space="preserve">   💸 PAID 0.02 dUSDC for /api/weather?city=Tokyo</text>
<text x="20" y="261" fill="#56d364" class="" xml:space="preserve">      tx: https://explorer.solana.com/tx/4wSGKrb8y1ubKfbcLTJumdoahFqYhMnyjk7ri4osdvoiB52kqeQYMNaYLSKrfQmFTUuZvmPoEUj5WbNBAiWbNKKa?cluster=devnet</text>
<text x="20" y="280" fill="#8b949e" class="" xml:space="preserve">   [server] 200 /api/weather?city=Tokyo paid 0.02 dUSDC tx=4wSGKrb8y1ubKfbcLTJumdoahFqYhMnyjk7ri4osdvoiB52kqeQYMNaYLSKrfQmFTUuZvmPoEUj5WbNBAiWbNK…</text>
<text x="20" y="299" fill="#56d364" class="" xml:space="preserve">   🔁 retried with PAYMENT-SIGNATURE → HTTP 200</text>
<text x="20" y="318" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="337" fill="#e6edf3" class="b" xml:space="preserve">🤖 Final answer:</text>
<text x="20" y="356" fill="#c9d1d9" class="" xml:space="preserve">   **結論:夕方の散歩は大阪のほうが向いています。**</text>
<text x="20" y="375" fill="#c9d1d9" class="" xml:space="preserve">   **支出:** 天気2件(0.02×2)と空気質2件(0.01×2)で合計0.06 dUSDCです。残り予算は0.24 dUSDCです。</text>
<text x="20" y="394" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="413" fill="#e6edf3" class="b" xml:space="preserve">━━━ 4. Scenario B — a purchase above the per-call cap ━━━━━━━━━━━━━━━━━━━━━</text>
<text x="20" y="432" fill="#e6edf3" class="b" xml:space="preserve">👤 Task: 東京のプレミアム48時間予報レポートを買って、明日いちばん雨の確率が低い時間帯を教えて。</text>
<text x="20" y="451" fill="#d2a8ff" class="" xml:space="preserve">🔧 request_api({"path":"/api/premium/forecast-report","query":{"city":"Tokyo"}})</text>
<text x="20" y="470" fill="#e3b341" class="" xml:space="preserve">   💳 402 Payment Required: /api/premium/forecast-report?city=Tokyo → 0.5 dUSDC (memo x402-GvwMSFuDHD2hHEnnF2SVZ1)</text>
<text x="20" y="489" fill="#e6edf3" class="b" xml:space="preserve">🤖 Final answer:</text>
<text x="20" y="508" fill="#c9d1d9" class="" xml:space="preserve">   プレミアム48時間予報レポートは買えませんでした。価格が0.50 dUSDCで、1回あたりの上限0.1 dUSDCと残り予算0.24 dUSDCのどちらも超えているためです。…</text>
<text x="20" y="527" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="546" fill="#e6edf3" class="b" xml:space="preserve">━━━ 5. Safety checks ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
<text x="20" y="565" fill="#ff7b72" class="" xml:space="preserve">   🛑 wallet refused to pay [per_call_cap_exceeded]: Price 500000 exceeds the per-call cap 100000.</text>
<text x="20" y="584" fill="#56d364" class="" xml:space="preserve">   ✔ over-cap payment refused by wallet guard: per_call_cap_exceeded</text>
<text x="20" y="603" fill="#56d364" class="" xml:space="preserve">   ✔ tampered 402 (payTo changed) refused: recipient_not_allowlisted</text>
<text x="20" y="622" fill="#8b949e" class="" xml:space="preserve">   [server] 402 /api/weather?city=Tokyo payment rejected: replayed_signature</text>
<text x="20" y="641" fill="#56d364" class="" xml:space="preserve">   ✔ replayed signature rejected by server: HTTP 402 (replayed_signature)</text>
<text x="20" y="660" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="679" fill="#e6edf3" class="b" xml:space="preserve">━━━ 6. Summary ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
<text x="20" y="698" fill="#c9d1d9" class="" xml:space="preserve">   payments made by the agent: 4, total 0.06 dUSDC (budget 0.30)</text>
<text x="20" y="717" fill="#c9d1d9" class="" xml:space="preserve">   agent dUSDC: 5 → 4.94</text>
<text x="20" y="736" fill="#c9d1d9" class="" xml:space="preserve">   server dUSDC: 0 → 0.06</text>
<text x="20" y="755" fill="#6e7681" class="" xml:space="preserve">   ⋮</text>
<text x="20" y="774" fill="#56d364" class="b" xml:space="preserve">✔ demo completed: on-chain received amount matches the agent's ledger</text>
