<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="AIエージェントが402を受け取り、予算内なら送金トランザクションに部分署名して再リクエストし、ファシリテーターが検証・共同署名してSolana devnetで決済、200とデータを受け取る流れ / An AI agent gets HTTP 402, partially signs a dUSDC transfer within its budget, retries; an x402 facilitator verifies, co-signs as fee payer and settles on Solana devnet; the agent receives 200 + data">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#1f2328}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace}
      .t{font-size:30px;font-weight:700}
      .st{font-size:15px;fill:#59636e}
      .h{font-size:21px;font-weight:700}
      .en{font-size:13px;fill:#59636e}
      .lab{font-size:15px;font-weight:700}
      .sub{font-size:12px;fill:#59636e}
      .chip{font-size:12.5px;font-weight:600}
      .num{font-size:13px;font-weight:700;fill:#ffffff}
    </style>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bf8700"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
  </defs>

  <!-- card background (keeps it readable on GitHub dark theme too) -->
  <rect x="1" y="1" width="1198" height="578" rx="20" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <text x="48" y="62" class="t">AIエージェントが、API の代金を自分で払う</text>
  <text x="48" y="90" class="st">An AI agent that pays for API calls by itself — official x402 (exact) on Solana devnet: 402 → signed tx → facilitator settles → 200</text>

  <!-- Agent -->
  <rect x="48" y="130" width="300" height="250" rx="16" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="72" y="168" class="h">🤖 AIエージェント</text>
  <text x="72" y="190" class="en">AI agent · Claude tool use · @x402/svm</text>
  <rect x="72" y="212" width="252" height="146" rx="10" fill="#ddf4ff"/>
  <text x="88" y="240" class="lab">予算つきウォレット</text>
  <text x="88" y="258" class="sub">budget-capped wallet</text>
  <text x="88" y="286" class="sub" style="font-size:13px;fill:#1f2328">• 1回の上限 0.10 dUSDC</text>
  <text x="88" y="308" class="sub" style="font-size:13px;fill:#1f2328">• 総予算 0.30 dUSDC</text>
  <text x="88" y="330" class="sub" style="font-size:13px;fill:#1f2328">• 受取人 allowlist</text>
  <text x="88" y="348" class="sub">per-call cap · budget · allowlist</text>

  <!-- 3 partial signing (inside the agent, nothing is sent on-chain by the agent) -->
  <path d="M198 380 L198 420" fill="none" stroke="#8250df" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="48" y="426" width="300" height="118" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="74" cy="454" r="12" fill="#8250df"/><text x="74" y="459" text-anchor="middle" class="num">3</text>
  <text x="96" y="460" class="lab" style="fill:#8250df">送金 tx に部分署名</text>
  <text x="72" y="484" class="sub">予算内のときだけ。SOL 手数料は不要</text>
  <text x="72" y="504" class="sub">partially signs TransferChecked (within budget)</text>
  <text x="72" y="522" class="sub">fee payer = facilitator · agent pays 0 SOL</text>

  <!-- Server -->
  <rect x="852" y="130" width="300" height="250" rx="16" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="876" y="168" class="h">🗄️ 有料APIサーバー</text>
  <text x="876" y="190" class="en">Paid API server · @x402/express</text>
  <rect x="876" y="212" width="252" height="146" rx="10" fill="#dafbe1"/>
  <text x="892" y="240" class="lab">決済が確定してから返す</text>
  <text x="892" y="258" class="sub">serves data only after settlement</text>
  <text x="892" y="286" class="sub" style="font-size:13px;fill:#1f2328">• 条件の照合（金額・受取人）</text>
  <text x="892" y="308" class="sub" style="font-size:13px;fill:#1f2328">• リプレイ防止</text>
  <text x="892" y="330" class="sub" style="font-size:13px;fill:#1f2328">• 保留時はオンチェーン照合</text>
  <text x="892" y="348" class="sub">terms match · replay guard · reconcile</text>

  <!-- Facilitator -->
  <rect x="852" y="426" width="300" height="118" rx="16" fill="#ffffff" stroke="#bf8700" stroke-width="2"/>
  <text x="876" y="462" class="h">🧾 ファシリテーター</text>
  <text x="876" y="484" class="en">x402 facilitator · x402.org (public) or local</text>
  <text x="876" y="508" class="sub" style="font-size:13px;fill:#1f2328">検証 → 共同署名(fee payer) → 送信</text>
  <text x="876" y="528" class="sub">verify → co-sign as fee payer → broadcast</text>

  <!-- Solana -->
  <rect x="430" y="440" width="330" height="100" rx="16" fill="#ffffff" stroke="url(#sol)" stroke-width="3"/>
  <circle cx="472" cy="490" r="20" fill="url(#sol)"/>
  <text x="472" y="496" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">◎</text>
  <text x="506" y="482" class="h">Solana devnet</text>
  <text x="506" y="506" class="en">テスト用トークン dUSDC（実資金なし）</text>
  <text x="506" y="524" class="en">test SPL token, no real funds</text>

  <!-- Arrows between agent and server -->
  <!-- 1 request -->
  <line x1="356" y1="160" x2="842" y2="160" stroke="#0969da" stroke-width="2.5" marker-end="url(#a1)"/>
  <circle cx="390" cy="160" r="12" fill="#0969da"/><text x="390" y="165" text-anchor="middle" class="num">1</text>
  <text x="412" y="150" class="lab">リクエスト <tspan class="mono" style="font-weight:400;font-size:13px">GET /api/weather</tspan></text>

  <!-- 2 402 -->
  <line x1="842" y1="214" x2="356" y2="214" stroke="#bf8700" stroke-width="2.5" marker-end="url(#a2)"/>
  <circle cx="808" cy="214" r="12" fill="#bf8700"/><text x="808" y="219" text-anchor="middle" class="num">2</text>
  <text x="412" y="204" class="lab" style="fill:#9a6700">402 Payment Required</text>
  <text x="412" y="234" class="sub">価格・受取人・トークン・fee payer / amount, payTo, asset, feePayer</text>

  <!-- 4 retry with signed tx -->
  <line x1="356" y1="290" x2="842" y2="290" stroke="#0969da" stroke-width="2.5" marker-end="url(#a1)"/>
  <circle cx="390" cy="290" r="12" fill="#0969da"/><text x="390" y="295" text-anchor="middle" class="num">4</text>
  <text x="412" y="280" class="lab">部分署名 tx つきで再リクエスト</text>
  <text x="412" y="310" class="sub mono">PAYMENT-SIGNATURE: signed tx (base64) / retry</text>

  <!-- 6 200 -->
  <line x1="842" y1="350" x2="356" y2="350" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#a4)"/>
  <circle cx="808" cy="350" r="12" fill="#1a7f37"/><text x="808" y="355" text-anchor="middle" class="num">6</text>
  <text x="412" y="342" class="lab" style="fill:#1a7f37">200 OK + データ</text>
  <text x="412" y="370" class="sub">PAYMENT-RESPONSE: 決済 tx / settlement tx · data</text>

  <!-- 5 server <-> facilitator, facilitator -> solana -->
  <line x1="1002" y1="384" x2="1002" y2="420" stroke="#bf8700" stroke-width="2.5" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <circle cx="1030" cy="402" r="12" fill="#bf8700"/><text x="1030" y="407" text-anchor="middle" class="num">5</text>
  <text x="1050" y="407" class="sub" style="font-size:13px;fill:#9a6700;font-weight:700">verify / settle</text>
  <line x1="846" y1="490" x2="768" y2="490" stroke="#bf8700" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="807" y="480" text-anchor="middle" class="sub" style="fill:#9a6700;font-weight:700">送信</text>
  <text x="807" y="508" text-anchor="middle" class="sub" style="fill:#9a6700;font-weight:700">broadcast</text>
</svg>
